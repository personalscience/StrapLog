# XcodeGen source of truth. Regenerate with `xcodegen generate`; never hand-edit StrapLog.xcodeproj.
name: StrapLog
options:
  bundleIdPrefix: com.personalscience
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 4RZ2RJUXC8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # App target stays in Swift 5 mode (SDK tuple typealiases); packages are Swift 6.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  HRVKit:
    path: Packages/HRVKit
  StrapLogCore:
    path: Packages/StrapLogCore
  PolarBleSdk:
    url: https://github.com/polarofficial/polar-ble-sdk.git
    majorVersion: 8.4.0

targets:
  StrapLog:
    type: application
    platform: iOS
    sources:
      - path: StrapLog
      # Replay fixture for the simulator and UI tests (`-replay resting`).
      - path: Tests/fixtures/resting.json
        buildPhase: resources
    dependencies:
      - package: HRVKit
      - package: StrapLogCore
      - package: PolarBleSdk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog
        # Rendered from design/AppIcon.svg by tools/render_icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: StrapLog/Resources/Info.plist
      properties:
        CFBundleDisplayName: StrapLog
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSBluetoothAlwaysUsageDescription: StrapLog connects to your Polar H10 chest strap to record heart rate and beat-to-beat intervals.
        UIBackgroundModes: [bluetooth-central]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  StrapLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StrapLogTests]
    dependencies:
      - target: StrapLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog.tests
        GENERATE_INFOPLIST_FILE: YES

  StrapLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StrapLogUITests]
    dependencies:
      - target: StrapLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  StrapLog:
    build:
      targets:
        StrapLog: all
    test:
      gatherCoverageData: true
      targets:
        - StrapLogTests
        - StrapLogUITests
