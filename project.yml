# XcodeGen source of truth. Regenerate with `xcodegen generate`; never hand-edit StrapLog.xcodeproj.
name: StrapLog
options:
  bundleIdPrefix: com.personalscience
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 4RZ2RJUXC8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0"
    # Placeholder: tools/stamp_build.sh sets CFBundleVersion to the git commit count.
    CURRENT_PROJECT_VERSION: "1"
    # App target stays in Swift 5 mode (SDK tuple typealiases); packages are Swift 6.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  HRVKit:
    path: Packages/HRVKit
  StrapLogCore:
    path: Packages/StrapLogCore
  PolarBleSdk:
    url: https://github.com/polarofficial/polar-ble-sdk.git
    majorVersion: 8.4.0

targets:
  StrapLog:
    type: application
    platform: iOS
    sources:
      - path: StrapLog
      # Live Activity attributes, intents and colours, also compiled into StrapLogWidgets.
      - path: Shared
      # Replay fixture for the simulator and UI tests (`-replay resting`).
      - path: Tests/fixtures/resting.json
        buildPhase: resources
    dependencies:
      - package: HRVKit
      - package: StrapLogCore
      - package: PolarBleSdk
      - target: StrapLogWidgets
      - target: StrapLogWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog
        # Rendered from design/AppIcon.svg by tools/render_icon.sh.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # tools/stamp_build.sh reads .git, outside any declarable input list.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp build
        script: '"$SRCROOT/tools/stamp_build.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    info:
      path: StrapLog/Resources/Info.plist
      properties:
        CFBundleDisplayName: StrapLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSBluetoothAlwaysUsageDescription: StrapLog connects to your Polar H10 chest strap to record heart rate and beat-to-beat intervals.
        UIBackgroundModes: [bluetooth-central]
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Exports go to the container's Documents, shown as iCloud Drive → StrapLog.
        NSUbiquitousContainers:
          iCloud.com.personalscience.straplog:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: StrapLog
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: StrapLog/Resources/StrapLog.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.com.personalscience.straplog]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.com.personalscience.straplog]

  StrapLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: StrapLogWidgets
      - path: Shared
    dependencies:
      - package: StrapLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Extensions must carry the app's CFBundleVersion.
    postBuildScripts:
      - name: Stamp build
        script: '"$SRCROOT/tools/stamp_build.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    info:
      path: StrapLogWidgets/Info.plist
      properties:
        CFBundleDisplayName: StrapLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Remote display and controller; the phone stays the only recorder (WatchConnectivity).
  StrapLogWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: StrapLogWatch
      - path: Shared/Alpha1Band+Color.swift
    dependencies:
      - package: StrapLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog.watchkitapp
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # A companion Watch app must carry the phone app's version and build.
    postBuildScripts:
      - name: Stamp build
        script: '"$SRCROOT/tools/stamp_build.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
    info:
      path: StrapLogWatch/Info.plist
      properties:
        CFBundleDisplayName: StrapLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.personalscience.straplog

  StrapLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StrapLogTests]
    dependencies:
      - target: StrapLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog.tests
        GENERATE_INFOPLIST_FILE: YES

  StrapLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StrapLogUITests]
    dependencies:
      - target: StrapLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalscience.straplog.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  StrapLog:
    build:
      targets:
        StrapLog: all
    test:
      gatherCoverageData: true
      targets:
        - StrapLogTests
        - StrapLogUITests
  # Builds and runs the Watch app on its own, e.g. to register a new Watch for signing.
  StrapLogWatch:
    build:
      targets:
        StrapLogWatch: all
