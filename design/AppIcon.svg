<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- StrapLog app icon. Ensembio weave (Corporation/Images/ensembio_logo.svg, scaled 1.5×
       and centred) with a black Polar-style strap: a full-width band through a ring whose
       inside is blank. Render: tools/render_icon.sh. -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <g transform="translate(103.25 129.5) scale(1.5)">
    <defs>
      <clipPath id="red-over-blue"><rect x="290" y="180" width="60" height="60"/></clipPath>
      <clipPath id="blue-over-green"><rect x="370" y="270" width="60" height="60"/></clipPath>
    </defs>
    <rect x="50" y="130" width="270" height="270" rx="6" fill="none" stroke="#FF0000" stroke-width="30"/>
    <rect x="130" y="210" width="270" height="270" rx="6" fill="none" stroke="#0000FF" stroke-width="30"/>
    <rect x="225" y="30" width="270" height="270" rx="6" fill="none" stroke="#00FF00" stroke-width="30"/>
    <rect x="50" y="130" width="270" height="270" rx="6" fill="none" stroke="#FF0000" stroke-width="30" clip-path="url(#red-over-blue)"/>
    <rect x="130" y="210" width="270" height="270" rx="6" fill="none" stroke="#0000FF" stroke-width="30" clip-path="url(#blue-over-green)"/>
  </g>
  <!-- White halo separating the strap from the weave -->
  <line x1="-40" y1="512" x2="1064" y2="512" stroke="#FFFFFF" stroke-width="92"/>
  <circle cx="512" cy="512" r="190" fill="#FFFFFF"/>
  <!-- Strap and ring; the disc blanks the inside of the ring -->
  <line x1="-40" y1="512" x2="1064" y2="512" stroke="#000000" stroke-width="60"/>
  <circle cx="512" cy="512" r="150" fill="#FFFFFF" stroke="#000000" stroke-width="60"/>
</svg>
